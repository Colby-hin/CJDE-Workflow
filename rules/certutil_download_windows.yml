title: Certutil Download

id: 04f639b1-5fe6-4d94-bc50-aed8fe471d2a

status: test

description: Detects Certutil being used to download a file over HTTP or HTTPS

author: Colby Hinchy

date: 2026-08-14

logsource:
  category: process_creation
  product: windows

detection:
  selection_image:
    Image|endswith: '\certutil.exe'

  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'

  selection_download:
    CommandLine|contains:
      - '-urlcache'

  condition: selection_image and selection_url and selection_download

falsepositives:
  - Legitimate administrative use of certutil

level: medium
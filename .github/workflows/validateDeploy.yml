name: Validate, Convert, and Deploy Sigma Rules to Graylog

on:
  push:
    branches:
      - main
    paths:
      - "rules/**/*.yml"
      - "rules/**/*.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "rules/**/*.yml"
      - "rules/**/*.yaml"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  validate:
    name: Validate Sigma Rules
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Sigma Rules
        uses: SigmaHQ/sigma-rules-validator@v1
        with:
          paths: |
            ./rules
          schemaFile: ${{ github.workspace }}/sigma-schema.json


  convert-and-deploy:
    name: Convert and Deploy to Graylog

    needs: validate

    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main')

    runs-on: [self-hosted, Linux, X64, graylog]

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      


      - name: Create Python Environment and Install Dependencies
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/graylog-venv"
          "$RUNNER_TEMP/graylog-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/graylog-venv/bin/python" -m pip install sigma-cli requests
          "$RUNNER_TEMP/graylog-venv/bin/sigma" plugin install elasticsearch


      - name: Find Changed Sigma Rules
        id: changed-files
        shell: bash

        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            CHANGED_FILES=$(find rules -type f \( -name "*.yml" -o -name "*.yaml" \) | sort)

          else

            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [[ "$BEFORE" =~ ^0+$ ]]; then

              CHANGED_FILES=$(find rules -type f \( -name "*.yml" -o -name "*.yaml" \) | sort)

            else

              CHANGED_FILES=$(git diff \
                --name-only \
                --diff-filter=AM \
                "$BEFORE" \
                "$AFTER" \
                -- rules \
                | grep -E '\.ya?ml$' || true)

            fi
          fi

          echo "Changed Sigma rules:"

          if [[ -n "$CHANGED_FILES" ]]; then
            echo "$CHANGED_FILES"
          else
            echo "None"
          fi

          {
            echo "changed_files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      - name: Convert and Deploy Changed Sigma Rules
        shell: bash

        env:
          GRAYLOG_URL: ${{ secrets.GRAYLOG_URL }}
          GRAYLOG_TOKEN: ${{ secrets.GRAYLOG_API_TOKEN }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.changed_files }}

        run: |
          set -uo pipefail

          if [[ -z "${CHANGED_FILES//[$'\t\r\n ']/}" ]]; then
            echo "No Sigma rules need processing."
            exit 0
          fi

          success_count=0
          failure_count=0

          while IFS= read -r file; do

            [[ -n "$file" ]] || continue

            if [[ ! -f "$file" ]]; then
              echo "Skipping missing file: $file"
              continue
            fi

            rule_name=$(basename "${file%.*}")

            echo "========================================"
            echo "Processing Sigma rule: $file"
            echo "Rule name: $rule_name"
            echo "========================================"

            echo "Converting Sigma rule to Lucene query..."

            if ! graylog_query=$("$RUNNER_TEMP/graylog-venv/bin/sigma" convert \
              -t lucene \
              -p ecs_windows \
              "$file"); then

              echo "ERROR: Sigma conversion failed for $file"

              failure_count=$((failure_count + 1))

              continue
            fi


            if [[ -z "$graylog_query" ]]; then

              echo "ERROR: Empty Lucene query generated for $file"

              failure_count=$((failure_count + 1))

              continue
            fi


            echo "Lucene query generated successfully:"
            echo "$graylog_query"

            echo "Deploying rule to Graylog..."


           if "$RUNNER_TEMP/graylog-venv/bin/python" scripts/deploy_to_graylog.py \
              --url "$GRAYLOG_URL" \
              --token "$GRAYLOG_TOKEN" \
              --rule "$rule_name" \
              --query "$graylog_query"; then

              echo "Rule deployed successfully to Graylog"

              success_count=$((success_count + 1))

            else

              echo "ERROR: Failed to deploy rule to Graylog"

              failure_count=$((failure_count + 1))

            fi


          done <<< "$CHANGED_FILES"


          echo
          echo "========================================"
          echo "Graylog deployment complete"
          echo "Successful rules: $success_count"
          echo "Failed rules:     $failure_count"
          echo "========================================"


          if (( failure_count > 0 )); then
            exit 1
          fi